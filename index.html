<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Wayang AR - Rama & Sinta</title>
  <style>
    html { background: #1a1210; }
    body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
    /* Wadah AR harus selalu penuh layar agar kamera dan objek AR ikut penuh */
    #adegan { position: fixed; top: 0; left: 0; width: 100%; height: 100%; overflow: hidden; }
    #petunjuk {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
      padding: 14px 16px calc(14px + env(safe-area-inset-bottom, 0px));
      text-align: center; font: 16px/1.4 Georgia, serif; color: #f4e2b8;
      background: rgba(26, 18, 16, .8); pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="petunjuk">Memuat mesin AR...</div>
  <div id="adegan"></div>

  <script>
    // Setiap pustaka dicoba dari beberapa sumber sampai ada yang berhasil.
    var SUMBER = {
      aframe: [
        "https://cdn.jsdelivr.net/npm/aframe@1.5.0/dist/aframe.min.js",
        "https://unpkg.com/aframe@1.5.0/dist/aframe.min.js",
        "https://aframe.io/releases/1.5.0/aframe.min.js"
      ],
      mindar: [
        "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js",
        "https://unpkg.com/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"
      ]
    };
    var info = document.getElementById("petunjuk");
    var gagalTerakhir = [];
    window.addEventListener("error", function (e) {
      if (e && e.message && e.message !== "Script error.") { info.textContent = "Error: " + e.message; }
    });

    function muat(daftar, i) {
      return new Promise(function (ok, gagal) {
        if (i >= daftar.length) { gagal(new Error("semua sumber gagal")); return; }
        var selesai = false;
        var s = document.createElement("script");
        function lanjut() {
          if (selesai) return; selesai = true;
          gagalTerakhir.push(daftar[i]);
          s.remove();
          muat(daftar, i + 1).then(ok, gagal);
        }
        s.onload = function () { if (!selesai) { selesai = true; ok(); } };
        s.onerror = lanjut;
        setTimeout(lanjut, 10000);
        s.src = daftar[i];
        document.head.appendChild(s);
      });
    }

    function mulai() {
      AFRAME.registerComponent("jaga-rasio", {
        schema: { tinggi: { type: "number", default: 0.5 }, berkas: { type: "string" } },
        init: function () {
          var el = this.el, tinggi = this.data.tinggi;
          // ukuran awal supaya tokoh pasti tampil walau pengukuran gagal
          el.setAttribute("height", tinggi);
          el.setAttribute("width", tinggi * 0.65);
          try {
            var im = new Image();
            im.onload = function () {
              if (im.naturalWidth && im.naturalHeight) {
                el.setAttribute("width", tinggi * im.naturalWidth / im.naturalHeight);
              }
            };
            im.src = this.data.berkas;
          } catch (e) {}
        }
      });

      document.getElementById("adegan").innerHTML =
        '<a-scene mindar-image="imageTargetSrc: ./marker.mind; maxTrack: 1;" color-space="sRGB" ' +
        'renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" ' +
        'device-orientation-permission-ui="enabled: false">' +
        '<a-assets>' +
        /* UBAH DI SINI jika nama atau ekstensi file gambar Anda berbeda */
        '<img id="rama" src="rama.png"><img id="sinta" src="sinta.png">' +
        '</a-assets>' +
        '<a-camera position="0 0 0" look-controls="enabled: false" cursor="fuse: false; rayOrigin: mouse;" ' +
        'raycaster="far: 10000; objects: .bisa-disentuh"></a-camera>' +
        '<a-entity mindar-image-target="targetIndex: 0">' +
        /* PENANDA UJI (sementara): kotak kuning dan kubus merah, boleh dihapus nanti */
        '<a-plane color="#ffcc00" opacity="0.3" width="1" height="0.7" position="0 0 0"></a-plane>' +
        '<a-box color="#d33" width="0.12" height="0.12" depth="0.12" position="0 0.45 0.1"></a-box>' +
        '<a-image class="bisa-disentuh" src="#rama" jaga-rasio="tinggi: 0.6; berkas: rama.png" position="-0.25 0.2 0.08" ' +
        'animation__melayang="property: position; to: -0.25 0.23 0.08; dir: alternate; dur: 1800; easing: easeInOutSine; loop: true" ' +
        'animation__goyang="property: rotation; from: 0 0 -10; to: 0 0 10; dur: 250; dir: alternate; loop: 4; startEvents: click"></a-image>' +
        '<a-image class="bisa-disentuh" src="#sinta" jaga-rasio="tinggi: 0.6; berkas: sinta.png" position="0.25 0.2 0.08" ' +
        'animation__melayang="property: position; to: 0.25 0.23 0.08; dir: alternate; dur: 2100; easing: easeInOutSine; loop: true" ' +
        'animation__goyang="property: rotation; from: 0 0 -10; to: 0 0 10; dur: 250; dir: alternate; loop: 4; startEvents: click"></a-image>' +
        '</a-entity></a-scene>';
      info.textContent = "Arahkan kamera ke gambar marker. Sentuh tokoh untuk menggerakkannya.";

      // Status di layar: membantu mengetahui apakah marker terdeteksi
      var sasaran = document.querySelector("[mindar-image-target]");
      sasaran.addEventListener("targetFound", function () {
        info.textContent = "Marker terdeteksi! Rama dan Sinta seharusnya muncul. Sentuh untuk menggerakkan.";
      });
      sasaran.addEventListener("targetLost", function () {
        info.textContent = "Marker hilang. Arahkan kembali kamera ke marker.";
      });
      // Cek apakah gambar tokoh berhasil dimuat
      setTimeout(function () {
        ["rama", "sinta"].forEach(function (id) {
          var im = document.getElementById(id);
          if (im && im.complete && im.naturalWidth === 0) {
            info.textContent = "Gambar " + id + " gagal dimuat. Periksa nama file " + id + ".png di GitHub.";
          }
        });
      }, 4000);
    }

    muat(SUMBER.aframe, 0)
      .then(function () { info.textContent = "A-Frame termuat. Memuat MindAR..."; return muat(SUMBER.mindar, 0); })
      .then(mulai)
      .catch(function () {
        info.style.pointerEvents = "auto";
        info.textContent = "Gagal memuat mesin AR dari semua sumber (" + gagalTerakhir.length +
          " percobaan). Jaringan atau browser Anda kemungkinan memblokir pustaka. Coba jaringan atau browser lain.";
      });
  </script>
</body>
</html>
