<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Wayang AR - Rama & Sinta</title>
  <style>
    html { background: #1a1210; }
    body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
    /* Wadah AR harus selalu penuh layar agar kamera dan objek AR ikut penuh */
    #adegan { position: fixed; top: 0; left: 0; width: 100%; height: 100%; overflow: hidden; }
    #petunjuk {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
      padding: 14px 16px calc(14px + env(safe-area-inset-bottom, 0px));
      text-align: center; font: 16px/1.4 Georgia, serif; color: #f4e2b8;
      background: rgba(26, 18, 16, .8); pointer-events: none;
    }
    /* Kotak dialog wayang */
    #dialog {
      display: none; position: fixed; z-index: 10; left: 12px; right: 12px; max-width: 520px; margin: 0 auto;
      top: calc(68px + env(safe-area-inset-top, 0px));
      padding: 12px 16px; border: 2px solid #d9a441; border-radius: 12px;
      background: rgba(26, 18, 16, .9); color: #f4e2b8; font: 17px/1.5 Georgia, serif;
      pointer-events: none;
    }
    #dialog b { display: block; margin-bottom: 4px; color: #d9a441; font-size: 18px; }
    /* Tombol suara */
    #suara {
      display: none; position: fixed; z-index: 11; right: 12px;
      top: calc(12px + env(safe-area-inset-top, 0px));
      width: 46px; height: 46px; padding: 0; border-radius: 50%;
      border: 2px solid #d9a441; background: rgba(26, 18, 16, .85); color: #f4e2b8; font-size: 22px;
    }
  </style>
</head>
<body>
  <div id="dialog"><b id="dlgNama"></b><span id="dlgTeks"></span></div>
  <button id="suara" type="button" aria-label="Nyalakan atau matikan suara gamelan">🔊</button>
  <div id="petunjuk">Memuat mesin AR...</div>
  <div id="adegan"></div>
  <!-- Musik latar: simpan file bernama gamelan.mp3 di folder yang sama. Kalau tidak ada, halaman tetap jalan tanpa suara. -->
  <audio id="gamelan" src="gamelan.mp3" loop preload="auto"></audio>

  <script>
    // ====== PENGATURAN YANG BOLEH ANDA UBAH ======
    var DIALOG = {
      rama: { nama: "Rama", i: 0, baris: [
        "Dinda Sinta, hatiku tenang selama engkau berada di sisiku.",
        "Apa pun rintangannya, kita akan tetap bersama.",
        "Kebenaran akan selalu menang atas keangkaraan."
      ]},
      sinta: { nama: "Sinta", i: 0, baris: [
        "Kanda Rama, aku percaya padamu seperti bumi percaya pada matahari.",
        "Aku akan menjaga kesetiaan hatiku, di mana pun aku berada.",
        "Kesabaran adalah cahaya di tengah gelap."
      ]}
    };
    var LAMA_DIALOG_MS = 7000;   // berapa lama kotak dialog tampil
    // =============================================

    // Setiap pustaka dicoba dari beberapa sumber sampai ada yang berhasil.
    var SUMBER = {
      aframe: [
        "https://cdn.jsdelivr.net/npm/aframe@1.5.0/dist/aframe.min.js",
        "https://unpkg.com/aframe@1.5.0/dist/aframe.min.js",
        "https://aframe.io/releases/1.5.0/aframe.min.js"
      ],
      mindar: [
        "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js",
        "https://unpkg.com/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"
      ]
    };
    var info = document.getElementById("petunjuk");
    var kotak = document.getElementById("dialog");
    var tombolSuara = document.getElementById("suara");
    var audio = document.getElementById("gamelan");
    var gagalTerakhir = [];
    window.addEventListener("error", function (e) {
      if (e && e.message && e.message !== "Script error.") { info.textContent = "Error: " + e.message; }
    });

    function muat(daftar, i) {
      return new Promise(function (ok, gagal) {
        if (i >= daftar.length) { gagal(new Error("semua sumber gagal")); return; }
        var selesai = false;
        var s = document.createElement("script");
        function lanjut() {
          if (selesai) return; selesai = true;
          gagalTerakhir.push(daftar[i]);
          s.remove();
          muat(daftar, i + 1).then(ok, gagal);
        }
        s.onload = function () { if (!selesai) { selesai = true; ok(); } };
        s.onerror = lanjut;
        setTimeout(lanjut, 10000);
        s.src = daftar[i];
        document.head.appendChild(s);
      });
    }

    // ---------- Suara ----------
    var suaraAktif = true, sudahDisentuh = false, markerTerlihat = false;
    if (audio) audio.volume = 0.6;

    function mainkan() {
      if (!audio || !suaraAktif || !sudahDisentuh || !markerTerlihat) return;
      var p = audio.play();
      if (p && p.catch) p.catch(function () {});
    }
    // Browser HP hanya mengizinkan suara setelah layar disentuh. Sentuhan pertama "membuka kunci" suara.
    function bukaKunci() {
      if (sudahDisentuh || !audio) return;
      sudahDisentuh = true;
      var p = audio.play();
      if (p && p.then) {
        p.then(function () { if (!(suaraAktif && markerTerlihat)) audio.pause(); })
         .catch(function () { sudahDisentuh = false; });
      }
    }
    document.addEventListener("touchend", bukaKunci, { passive: true });
    document.addEventListener("click", bukaKunci);

    tombolSuara.addEventListener("click", function () {
      suaraAktif = !suaraAktif;
      tombolSuara.textContent = suaraAktif ? "🔊" : "🔇";
      if (suaraAktif) { mainkan(); } else if (audio) { audio.pause(); }
    });
    if (audio) {
      audio.addEventListener("error", function () { tombolSuara.style.display = "none"; });
      setTimeout(function () { if (audio.error) tombolSuara.style.display = "none"; }, 3000);
    }

    // ---------- Dialog ----------
    var timerDialog = null, terakhirDialog = 0, giliranBerikut = "rama";
    function tampilDialog(kunci) {
      var sekarang = Date.now();
      if (sekarang - terakhirDialog < 600) return;   // cegah dobel sentuh
      var t = DIALOG[kunci];
      if (!t) return;
      terakhirDialog = sekarang;
      document.getElementById("dlgNama").textContent = t.nama;
      document.getElementById("dlgTeks").textContent = t.baris[t.i % t.baris.length];
      t.i++;
      giliranBerikut = (kunci === "rama") ? "sinta" : "rama";
      kotak.style.display = "block";
      clearTimeout(timerDialog);
      timerDialog = setTimeout(function () { kotak.style.display = "none"; }, LAMA_DIALOG_MS);
    }

    function mulai() {
      AFRAME.registerComponent("jaga-rasio", {
        schema: { tinggi: { type: "number", default: 0.5 }, berkas: { type: "string" } },
        init: function () {
          var el = this.el, tinggi = this.data.tinggi;
          // ukuran awal supaya tokoh pasti tampil walau pengukuran gagal
          el.setAttribute("height", tinggi);
          el.setAttribute("width", tinggi * 0.65);
          try {
            var im = new Image();
            im.onload = function () {
              if (im.naturalWidth && im.naturalHeight) {
                el.setAttribute("width", tinggi * im.naturalWidth / im.naturalHeight);
              }
            };
            im.src = this.data.berkas;
          } catch (e) {}
        }
      });

      document.getElementById("adegan").innerHTML =
        '<a-scene mindar-image="imageTargetSrc: ./marker.mind; maxTrack: 1;" color-space="sRGB" ' +
        'renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" ' +
        'device-orientation-permission-ui="enabled: false">' +
        '<a-assets>' +
        /* UBAH DI SINI jika nama atau ekstensi file gambar Anda berbeda */
        '<img id="rama" src="rama.png"><img id="sinta" src="sinta.png">' +
        '</a-assets>' +
        '<a-camera position="0 0 0" look-controls="enabled: false" cursor="fuse: false; rayOrigin: mouse;" ' +
        'raycaster="far: 10000; objects: .bisa-disentuh"></a-camera>' +
        '<a-entity mindar-image-target="targetIndex: 0">' +
        '<a-image class="bisa-disentuh" data-tokoh="rama" src="#rama" jaga-rasio="tinggi: 0.6; berkas: rama.png" position="-0.25 0.2 0.08" ' +
        'animation__melayang="property: position; to: -0.25 0.23 0.08; dir: alternate; dur: 1800; easing: easeInOutSine; loop: true" ' +
        'animation__goyang="property: rotation; from: 0 0 -10; to: 0 0 10; dur: 250; dir: alternate; loop: 4; startEvents: click"></a-image>' +
        '<a-image class="bisa-disentuh" data-tokoh="sinta" src="#sinta" jaga-rasio="tinggi: 0.6; berkas: sinta.png" position="0.25 0.2 0.08" ' +
        'animation__melayang="property: position; to: 0.25 0.23 0.08; dir: alternate; dur: 2100; easing: easeInOutSine; loop: true" ' +
        'animation__goyang="property: rotation; from: 0 0 -10; to: 0 0 10; dur: 250; dir: alternate; loop: 4; startEvents: click"></a-image>' +
        '</a-entity></a-scene>';
      info.textContent = "Arahkan kamera ke gambar marker. Sentuh tokoh untuk mendengar dialognya.";
      tombolSuara.style.display = "block";

      var tokoh = {};
      Array.prototype.forEach.call(document.querySelectorAll(".bisa-disentuh"), function (el) {
        var kunci = el.getAttribute("data-tokoh");
        tokoh[kunci] = el;
        el.addEventListener("click", function () { tampilDialog(kunci); });
      });

      // Cadangan: kalau sentuhan tidak mengenai tokoh, ketuk layar tetap memunculkan dialog berikutnya
      document.addEventListener("click", function (e) {
        if (!markerTerlihat || (e.target && e.target.id === "suara")) return;
        if (Date.now() - terakhirDialog < 600) return;
        var el = tokoh[giliranBerikut];
        if (el && el.emit) el.emit("click"); else tampilDialog(giliranBerikut);
      });

      var sasaran = document.querySelector("[mindar-image-target]");
      sasaran.addEventListener("targetFound", function () {
        markerTerlihat = true;
        info.style.display = "none";
        mainkan();
      });
      sasaran.addEventListener("targetLost", function () {
        markerTerlihat = false;
        if (audio) audio.pause();
        kotak.style.display = "none";
        info.style.display = "block";
        info.textContent = "Marker hilang. Arahkan kembali kamera ke marker.";
      });

      // Cek apakah gambar tokoh berhasil dimuat
      setTimeout(function () {
        ["rama", "sinta"].forEach(function (id) {
          var im = document.getElementById(id);
          if (im && im.complete && im.naturalWidth === 0) {
            info.textContent = "Gambar " + id + " gagal dimuat. Periksa nama file " + id + ".png di GitHub.";
          }
        });
      }, 4000);
    }

    muat(SUMBER.aframe, 0)
      .then(function () { info.textContent = "A-Frame termuat. Memuat MindAR..."; return muat(SUMBER.mindar, 0); })
      .then(mulai)
      .catch(function (err) {
        if (err && err.message === "semua sumber gagal") {
          info.textContent = "Gagal memuat mesin AR dari semua sumber (" + gagalTerakhir.length +
            " percobaan). Jaringan atau browser Anda kemungkinan memblokir pustaka. Coba jaringan atau browser lain.";
        } else {
          info.textContent = "Error: " + (err && err.message ? err.message : err);
        }
      });
  </script>
</body>
</html>
